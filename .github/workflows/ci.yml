name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use reviewed npm version
        run: npm install --global npm@11.7.0
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --workspace=jobdiary
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build:web

  extension:
    name: Extension test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use reviewed npm version
        run: npm install --global npm@11.7.0
      - run: npm ci
      - run: npm run test:extension
      - run: npm run build:extension
