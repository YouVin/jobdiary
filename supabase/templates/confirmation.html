<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>취준일기에 오신 걸 환영해요</title>
</head>
<body style="margin:0;padding:0;background:#F5F7FA;">
<!-- 받은편지함 목록에 보이는 미리보기 한 줄 -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">버튼 하나만 누르면 가입이 끝나요.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F7FA;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <!-- 로고 -->
        <tr>
          <td style="padding:0 4px 20px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;"><img src="https://jobdiary.vercel.app/apple-icon.png" width="32" height="32" alt="" style="display:block;border:0;border-radius:8px;"></td>
                <td style="vertical-align:middle;padding-left:8px;font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;font-size:17px;font-weight:700;color:#1B2230;letter-spacing:-0.2px;">취준일기</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- 카드 -->
        <tr>
          <td style="background:#FFFFFF;border-radius:16px;padding:36px 32px 32px;font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;">
            <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#3461D1;">가입 확인</p>
            <h1 style="margin:0 0 12px;font-size:22px;line-height:1.4;font-weight:700;color:#1B2230;letter-spacing:-0.3px;word-break:keep-all;">취준일기에 오신 걸 환영해요</h1>
            <p style="margin:0 0 28px;font-size:15px;line-height:1.7;color:#5A6478;word-break:keep-all;">{{ .Email }} 주소가 맞는지 확인하면 가입이 끝나요. 확인한 뒤 바로 로그인해서 지원한 곳을 모아 볼 수 있어요.</p>
            <!-- 버튼(표로 만들어 Outlook에서도 버튼 모양 유지) -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#3461D1" style="border-radius:12px;">
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;padding:15px 24px;font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:12px;">이메일 확인하기</a>
                </td>
              </tr>
            </table>
            
            <!-- 버튼이 안 될 때 -->
            <p style="margin:28px 0 6px;padding-top:20px;border-top:1px solid #E6E9EF;font-size:13px;line-height:1.6;color:#8A93A6;">버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여 넣어 주세요.</p>
            <p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;"><a href="{{ .ConfirmationURL }}" target="_blank" style="color:#5A6478;text-decoration:underline;">{{ .ConfirmationURL }}</a></p>
          </td>
        </tr>
        <!-- 바닥 -->
        <tr>
          <td style="padding:20px 4px 0;font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;font-size:12px;line-height:1.7;color:#8A93A6;word-break:keep-all;">
            직접 요청하지 않았다면 이 메일은 무시해 주세요. 계정에는 아무 변화가 없어요.<br>
            <a href="https://jobdiary.vercel.app" target="_blank" style="color:#8A93A6;text-decoration:underline;">jobdiary.vercel.app</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
